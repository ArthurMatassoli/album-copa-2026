name: Generate Android App with Bubblewrap

on:
  push:
    branches:
      - main  # Ou a branch que preferir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap Environment
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
        cat ~/.bubblewrap/config.json # Verifica se os caminhos foram salvos

    - name: Decode or Generate Temporary Keystore
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Nenhum Keystore configurado nos Secrets. Gerando um de testes..."
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "my-test-alias" -storepass "android123" -keypass "android123" -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=BR"
          echo "KEYSTORE_PWD=android123" >> $GITHUB_ENV
          echo "KEY_PWD=android123" >> $GITHUB_ENV
          echo "KEY_ALIAS=my-test-alias" >> $GITHUB_ENV
        else
          echo "Lendo keystore dos Github Secrets..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "KEYSTORE_PWD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PWD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        fi

    - name: Build TWA APK and AAB
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PWD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PWD }}
      run: |
        # Caso o arquivo twa-manifest.json não esteja na raiz
        if [ ! -f twa-manifest.json ]; then
          echo "Fazendo o init do Bubblewrap..."
          bubblewrap init --manifest=https://arthurmatassoli.github.io/album-copa-2026/manifest.json --directory=./ --meta-data=./
        fi
        
        # O Bubblewrap das versões mais recentes falha ao gerar o build.gradle se faltar o campo splashScreenFadeOutDuration.
        # Vamos garantir que ele existe no twa-manifest.json para evitar o erro de sintaxe (, no Groovy).
        node -e "const fs = require('fs'); if (fs.existsSync('twa-manifest.json')) { let m = JSON.parse(fs.readFileSync('twa-manifest.json')); if (m.splashScreenFadeOutDuration === undefined) m.splashScreenFadeOutDuration = 300; fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2)); }"
        
        # A forma mais garantida de passar pelas perguntas sem entrar em loop infinito:
        # 1. Fazemos update forçando a pular as perguntas de versão. Ele criará as pastas nativas caso precisem ser geradas.
        bubblewrap update --skipVersionUpgrade || echo "Update skipped"
        # 2. Fazemos o build. O projeto já existirá ou estará atualizado, logo nenhuma pergunta será feita.
        bubblewrap build --skipUpdateCheck --signingKeyPath release.jks --signingKeyAlias "$KEY_ALIAS"

    - name: List outputs
      run: ls -la

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: twa-release-apk
        path: "*.apk"

    - name: Upload Release AAB (Google Play bundle)
      uses: actions/upload-artifact@v4
      with:
        name: twa-release-aab
        path: "*.aab"
