name: Build TWA do Álbum

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap Non-interactively
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

    - name: Build TWA APK and AAB
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ ! -f twa-manifest.json ]; then
          bubblewrap init --manifest=https://arthurmatassoli.github.io/album-copa-2026/manifest.json --directory=./ --meta-data=./
        fi
        
        # O "yes no" passa automaticamente a resposta "no" (não) caso o Bubblewrap faça a pergunta sobre o checksum do manifesto.
        yes no | bubblewrap build --skipUpdateCheck --signingKeyPath release.jks --signingKeyAlias "${{ secrets.KEY_ALIAS }}"

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: twa-release-apk
        path: "*.apk"

    - name: Upload Release AAB (Google Play bundle)
      uses: actions/upload-artifact@v4
      with:
        name: twa-release-aab
        path: "*.aab"
