name: Gerar APK TWA - Álbum 2026

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap Non-interactively
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

    - name: Decode Keystore Fingerprint
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

    - name: Build TWA APK and AAB
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Usando o twa-manifest.json fornecido no repositório para o build
        bubblewrap build --signingKeyPath release.jks --signingKeyAlias "${{ secrets.KEY_ALIAS }}"

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: album-copa-2026-apk
        path: "*.apk"

    - name: Upload Release AAB (Google Play bundle)
      uses: actions/upload-artifact@v4
      with:
        name: album-copa-2026-aab
        path: "*.aab"
